<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Atividade 7</title>
</head>
<body>
    <h1>Pedra, Papel ou Tesoura</h1>
    <button onclick="jogar()">Jogar</button>

    <script>
        function jogar() {
            let jogador = prompt("Escolha: pedra, papel ou tesoura").toLowerCase();
            let numero = Math.floor(Math.random() * 3);
            let computador;

            if (numero == 0) {
                computador = "pedra";
            } else if (numero == 1) {
                computador = "papel";
            } else {
                computador = "tesoura";
            }

            if (jogador != "pedra" && jogador != "papel" && jogador != "tesoura") {
                alert("Escolha inválida!");
            } else if (jogador == computador) {
                alert("Computador escolheu " + computador + ". Empate!");
            } else if (
                (jogador == "pedra" && computador == "tesoura") ||
                (jogador == "papel" && computador == "pedra") ||
                (jogador == "tesoura" && computador == "papel")
            ) {
                alert("Computador escolheu " + computador + ". Você ganhou!");
            } else {
                alert("Computador escolheu " + computador + ". Você perdeu!");
            }
        }
    </script>
</body>
</html>
