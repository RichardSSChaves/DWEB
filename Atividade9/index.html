    <h2>1) Maior de três números</h2>

    <input type="number" id="numero2" step="any" placeholder="Segundo número">
    <input type="number" id="numero3" step="any" placeholder="Terceiro número">
    <button onclick="funcao1();">Encontrar o maior</button>
    <p id="resultado1"></p>

    <h2>2) Números em ordem crescente</h2>
    <p>Use os três números digitados acima.</p>
