<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mercadinho Silva Camargo</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eff3ff;color:#334155}header{background:#1747e9;color:white;padding:18px}header>div{max-width:1000px;margin:auto;display:flex;align-items:center;gap:20px}h1{font-size:22px;margin:0}header p{margin:6px 0 0}main{max-width:1000px;margin:28px auto;padding:0 16px}button,a.botao{cursor:pointer;border:0;border-radius:10px;padding:12px 16px;font-weight:bold;background:#154ee6;color:white;text-decoration:none;display:inline-block}button:hover,a.botao:hover{filter:brightness(.92)}button.cinza{background:#e2e8f0;color:#334155}button.verde{background:#008348}button.vermelho{background:#c60016}#login{min-height:100vh;display:grid;place-items:center;padding:16px}#login form,.painel{background:white;border-radius:16px;padding:24px;box-shadow:0 6px 18px #0001}#login form{width:100%;max-width:410px;text-align:center}#login input{margin-bottom:12px}input,select,textarea{font:inherit;padding:12px;border-radius:10px;border:1px solid #cbd5e1;width:100%;background:white}label{font-weight:bold;display:block;margin-bottom:6px}.campo{margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}.card{min-height:180px;border-radius:16px;border:1px solid;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;cursor:pointer;gap:8px;font-size:20px}.card small{font-size:15px;color:#64748b}.card b{font-size:24px}.card:nth-child(1){background:#eff5ff;color:#1747e9;border-color:#b6cfff}.card:nth-child(2){background:#e9fff5;color:#007d54;border-color:#97eac5}.card:nth-child(3){background:#fff9dd;color:#b95800;border-color:#ffdf64}.card:nth-child(4){background:#fbf1ff;color:#8500d7;border-color:#ebc8ff}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}.toolbar input{flex:1;min-width:160px}.resumos{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.resumo{padding:18px;text-align:center;border-radius:12px;font-weight:bold}.resumo strong{display:block;font-size:30px}.resumo:nth-child(1){background:#d9fce6;color:#00853a}.resumo:nth-child(2){background:#fff0bf;color:#b95b00}.resumo:nth-child(3){background:#ffe0e0;color:#c20016}table{border-collapse:collapse;width:100%;min-width:620px;background:white}th,td{padding:13px;border-bottom:1px solid #e2e8f0;text-align:left}th{background:#f1f5f9}.tabela{overflow:auto;border-radius:12px;background:white}.painel{margin:18px 0}.painel h2{margin-top:0}.clicavel{cursor:pointer}.clicavel:hover{background:#fff5cc}.linha-botoes{display:flex;gap:7px;flex-wrap:wrap}.erro{color:#b91c1c}small{color:#64748b}#app{display:none}.titulo{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}@media(max-width:650px){.cards,.grid{grid-template-columns:1fr}.resumo{padding:12px 2px}.resumo strong{font-size:24px}.resumo{font-size:12px}header h1{font-size:17px}}@media print{header,.toolbar,.painel form,button{display:none!important}main{max-width:100%}}
</style></head><body><section id="login"><form id="loginForm"><h1 style="color:#184ee6">MERCADINHO<br>SILVA CAMARGO</h1><p>Sistema de Controle de Estoque</p><div class="campo" style="text-align:left"><label>Usuário</label><input id="user" required></div><div class="campo" style="text-align:left"><label>Senha</label><input id="password" type="password" required></div><p id="loginErro" class="erro"></p><button style="width:100%">ENTRAR</button><p><small>Acesso de demonstração: admin / 1234</small></p></form></section><div id="app"><header><div><div style="flex:1"><h1 id="cabecalho">MERCADINHO SILVA CAMARGO</h1><p id="subtitulo">Olá, admin!</p></div><button class="cinza" onclick="voltar()">← Dashboard</button><button onclick="sair()">Sair</button></div></header><main id="principal"></main></div><script>
const P='produtos_mercadinho',F='fornecedores_mercadinho',M='movimentacoes_mercadinho';let pagina='dashboard',editor=null,modo='entrada';const $=id=>document.getElementById(id),ler=k=>{try{return JSON.parse(localStorage.getItem(k))||[]}catch{return[]}},salvar=(k,v)=>localStorage.setItem(k,JSON.stringify(v)),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=v=>Number(v||0),gerar=()=>String(Date.now())+Math.random().toString(36).slice(2,6),status=p=>num(p.qtd)===0?'Sem estoque':num(p.qtd)<=num(p.minimo)?'Estoque baixo':'Normal';
function entrar(){ $('login').style.display='none';$('app').style.display='block';abrir('dashboard') }function sair(){sessionStorage.removeItem('logado');$('app').style.display='none';$('login').style.display='grid'}$('loginForm').onsubmit=e=>{e.preventDefault();if($('user').value.trim()==='admin'&&$('password').value==='1234'){sessionStorage.setItem('logado','sim');entrar()}else $('loginErro').textContent='Usuário ou senha inválidos.'};if(sessionStorage.getItem('logado')==='sim')entrar();function voltar(){abrir('dashboard')}
function abrir(p){pagina=p;editor=null;const tit={dashboard:'MERCADINHO SILVA CAMARGO',produtos:'Produtos',fornecedores:'Fornecedores',estoque:'Controle de Estoque',relatorios:'Relatório de Movimentações'};$('cabecalho').textContent=tit[p];$('subtitulo').textContent=p==='dashboard'?'Olá, admin!':p==='relatorios'?'MERCADINHO SILVA CAMARGO':'';if(p==='dashboard')$('principal').innerHTML='<p style="text-align:center">Escolha uma opção abaixo:</p><div class="cards"><div class="card" onclick="abrir(\'produtos\')"><b>▣ Produtos</b><small>Cadastrar e consultar produtos</small></div><div class="card" onclick="abrir(\'fornecedores\')"><b>♧ Fornecedores</b><small>Cadastrar e consultar fornecedores</small></div><div class="card" onclick="abrir(\'estoque\')"><b>▤ Estoque</b><small>Ver estoque e registrar entradas/saídas</small></div><div class="card" onclick="abrir(\'relatorios\')"><b>▥ Relatórios</b><small>Histórico de movimentações</small></div></div>';else if(p==='produtos')telaProdutos();else if(p==='fornecedores')telaFornecedores();else if(p==='estoque')telaEstoque();else telaRelatorios()}
function cel(label,id,val='',type='text'){return '<div class="campo"><label for="'+id+'">'+label+'</label><input id="'+id+'" type="'+type+'" value="'+esc(val)+'"></div>'}
function telaProdutos(){let ps=ler(P);$('subtitulo').textContent=ps.length+' produtos cadastrados';$('principal').innerHTML='<div class="toolbar"><input id="busca" placeholder="Pesquisar produto, código ou categoria" oninput="listaProdutos()"><button onclick="formProduto()">+ Novo Produto</button></div><div id="editor"></div><div class="tabela"><table><thead><tr><th>Produto</th><th>Categoria</th><th>Código</th><th>Venda</th><th>Estoque</th><th>Ações</th></tr></thead><tbody id="linhas"></tbody></table></div>';listaProdutos()}
function listaProdutos(){let busca=($('busca')?.value||'').toLowerCase();$('linhas').innerHTML=ler(P).filter(p=>(p.nome+' '+p.categoria+' '+p.barras).toLowerCase().includes(busca)).map(p=>'<tr><td>'+esc(p.nome)+'</td><td>'+esc(p.categoria)+'</td><td>'+esc(p.barras)+'</td><td>R$ '+num(p.venda).toFixed(2)+'</td><td>'+num(p.qtd)+'</td><td><div class="linha-botoes"><button class="cinza" onclick="formProduto(\''+p.id+'\')">Editar</button><button class="vermelho" onclick="excluirProduto(\''+p.id+'\')">Excluir</button></div></td></tr>').join('')||'<tr><td colspan="6">Nenhum produto encontrado.</td></tr>'}
function formProduto(id){editor=id||null;let p=ler(P).find(x=>x.id===id)||{};let fs=ler(F);$('editor').innerHTML='<div class="painel"><h2>'+(id?'Editar':'Novo')+' Produto</h2><form id="formP"><div class="grid">'+cel('Nome do Produto *','pn',p.nome)+cel('Categoria *','pc',p.categoria)+cel('Código de Barras *','pb',p.barras)+'<div class="campo"><label>Fornecedor *</label><select id="pf"><option value="">Selecione</option>'+[...new Set([...fs.map(f=>f.nome),...(p.fornecedor?[p.fornecedor]:[])])].map(n=>'<option '+(n===p.fornecedor?'selected':'')+'>'+esc(n)+'</option>').join('')+'</select></div>'+cel('Preço de Custo (R$)','pco',p.custo,'number')+cel('Preço de Venda (R$)','pv',p.venda,'number')+cel('Quantidade em Estoque','pq',p.qtd,'number')+cel('Estoque mínimo','pm',p.minimo,'number')+cel('Unidade de medida','pu',p.unidade||'un')+cel('Localização','pl',p.local)+'</div>'+cel('Observações','po',p.obs)+'<button>✓ Salvar</button> <button type="button" class="cinza" onclick="telaProdutos()">Cancelar</button></form></div>';$('formP').onsubmit=e=>{e.preventDefault();let d={nome:$('pn').value.trim(),categoria:$('pc').value.trim(),barras:$('pb').value.trim(),fornecedor:$('pf').value,custo:num($('pco').value),venda:num($('pv').value),qtd:num($('pq').value),minimo:num($('pm').value),unidade:$('pu').value,local:$('pl').value,obs:$('po').value};if(!d.nome||!d.categoria||!/^\d+$/.test(d.barras)||!d.fornecedor)return alert('Preencha nome, categoria, código numérico e fornecedor.');if([d.custo,d.venda,d.qtd,d.minimo].some(v=>v<0)||!Number.isInteger(d.qtd))return alert('Valores inválidos.');let ps=ler(P);if(ps.some(x=>x.barras===d.barras&&x.id!==id))return alert('Código de barras já cadastrado.');if(id)ps=ps.map(x=>x.id===id?{...x,...d}:x);else{d.id=gerar();ps.push(d)}salvar(P,ps);if(!id&&d.qtd>0)mov({produtoId:d.id,produto:d.nome,tipo:'entrada',quantidade:d.qtd,final:d.qtd,observacao:'Estoque inicial'});telaProdutos()}}
function excluirProduto(id){let ps=ler(P),p=ps.find(x=>x.id===id);if(p&&confirm('Excluir '+p.nome+'?')){salvar(P,ps.filter(x=>x.id!==id));telaProdutos()}}
function telaFornecedores(){$('subtitulo').textContent=ler(F).length+' fornecedores cadastrados';$('principal').innerHTML='<div class="toolbar"><input id="busca" oninput="listaFornecedores()" placeholder="Buscar fornecedor"><button class="verde" onclick="formFornecedor()">+ Novo fornecedor</button></div><div id="editor"></div><div class="tabela"><table><thead><tr><th>Nome</th><th>Telefone</th><th>E-mail</th><th>Produtos</th><th>Ações</th></tr></thead><tbody id="linhas"></tbody></table></div>';listaFornecedores()}
function listaFornecedores(){let q=($('busca').value||'').toLowerCase();$('linhas').innerHTML=ler(F).filter(f=>(f.nome+' '+f.itens).toLowerCase().includes(q)).map(f=>'<tr><td>'+esc(f.nome)+'</td><td>'+esc(f.telefone)+'</td><td>'+esc(f.email)+'</td><td>'+esc(f.itens)+'</td><td><button class="cinza" onclick="formFornecedor(\''+f.id+'\')">Editar</button> <button class="vermelho" onclick="excluirFornecedor(\''+f.id+'\')">Excluir</button></td></tr>').join('')||'<tr><td colspan="5">Nenhum fornecedor encontrado.</td></tr>'}
function formFornecedor(id){let f=ler(F).find(x=>x.id===id)||{};editor=id;$('editor').innerHTML='<div class="painel"><h2>'+(id?'Editar':'Novo')+' Fornecedor</h2><form id="formF">'+cel('Nome do Fornecedor *','fn',f.nome)+'<div class="grid">'+cel('Telefone','ft',f.telefone)+cel('WhatsApp','fw',f.whatsapp)+cel('E-mail','fe',f.email,'email')+cel('Prazo de pagamento','fp',f.prazo)+cel('Produtos fornecidos','fi',f.itens)+'</div>'+cel('Endereço','fa',f.endereco)+cel('Observações','fo',f.obs)+'<button class="verde">✓ Salvar</button> <button type="button" class="cinza" onclick="telaFornecedores()">Cancelar</button></form></div>';$('formF').onsubmit=e=>{e.preventDefault();let d={nome:$('fn').value.trim(),telefone:$('ft').value,whatsapp:$('fw').value,email:$('fe').value,prazo:$('fp').value,itens:$('fi').value,endereco:$('fa').value,obs:$('fo').value};if(!d.nome)return alert('Informe o nome.');let fs=ler(F);if(id)fs=fs.map(f=>f.id===id?{...f,...d}:f);else fs.push({id:gerar(),...d});salvar(F,fs);telaFornecedores()}}
function excluirFornecedor(id){let fs=ler(F);if(confirm('Excluir este fornecedor?')){salvar(F,fs.filter(f=>f.id!==id));telaFornecedores()}}
function telaEstoque(){let ps=ler(P);$('subtitulo').textContent=ps.length+' produtos cadastrados';$('principal').innerHTML='<div class="resumos"><div class="resumo">✓<strong>'+ps.filter(p=>status(p)==='Normal').length+'</strong>Normal</div><div class="resumo">⚠<strong>'+ps.filter(p=>status(p)==='Estoque baixo').length+'</strong>Estoque Baixo</div><div class="resumo">⊗<strong>'+ps.filter(p=>status(p)==='Sem estoque').length+'</strong>Sem Estoque</div></div><div class="toolbar"><button class="verde" onclick="formMov(\'entrada\')">↗ Entrada de Produtos</button><button class="vermelho" onclick="formMov(\'saida\')">↘ Saída de Produtos</button><button onclick="formMov(\'ajuste\')">⟳ Ajuste de Estoque</button></div><div id="editor"></div><div class="toolbar"><input id="busca" placeholder="Buscar por nome, código ou categoria" oninput="listaEstoque()"></div><div class="tabela"><table><thead><tr><th>Produto</th><th>Categoria</th><th>Qtd. Atual</th><th>Qtd. Mínima</th><th>Localização</th><th>Situação</th></tr></thead><tbody id="linhas"></tbody></table></div><p><small>Clique no produto para registrar sua saída.</small></p>';listaEstoque()}
function listaEstoque(){let q=($('busca').value||'').toLowerCase();$('linhas').innerHTML=ler(P).filter(p=>(p.nome+' '+p.categoria+' '+p.barras).toLowerCase().includes(q)).map(p=>'<tr class="clicavel" onclick="formMov(\'saida\',\''+p.id+'\')"><td>'+esc(p.nome)+'</td><td>'+esc(p.categoria)+'</td><td>'+num(p.qtd)+'</td><td>'+num(p.minimo)+'</td><td>'+esc(p.local)+'</td><td>'+status(p)+'</td></tr>').join('')||'<tr><td colspan="6">Nenhum produto encontrado.</td></tr>'}
function formMov(t,id){modo=t;let ps=ler(P),fs=ler(F);$('editor').innerHTML='<div class="painel"><h2>'+({entrada:'Entrada de Produtos',saida:'Saída de Produtos',ajuste:'Ajuste de Estoque'}[t])+'</h2><form id="formM"><div class="campo"><label>Produto *</label><select id="mp"><option value="">Selecione o produto</option>'+ps.map(p=>'<option value="'+p.id+'" '+(id===p.id?'selected':'')+'>'+esc(p.nome)+'</option>').join('')+'</select></div><div class="grid"><div class="campo"><label>'+(t==='ajuste'?'Quantidade Final':'Quantidade')+' *</label><input id="mq" type="number" min="'+(t==='ajuste'?'0':'1')+'" step="1" required placeholder="0"></div>'+(t==='entrada'?'<div class="campo"><label>Fornecedor</label><select id="mf"><option value="">Não informado</option>'+fs.map(f=>'<option value="'+f.id+'">'+esc(f.nome)+'</option>').join('')+'</select></div>':'')+'</div>'+cel('Motivo / Observação','mo')+'<button class="'+(t==='saida'?'vermelho':t==='entrada'?'verde':'')+'">✓ Confirmar</button> <button type="button" class="cinza" onclick="telaEstoque()">Cancelar</button></form></div>';$('formM').onsubmit=e=>{e.preventDefault();let ps=ler(P),p=ps.find(x=>x.id===$('mp').value),q=num($('mq').value);if(!p)return alert('Selecione um produto.');if(!Number.isInteger(q)||q<(t==='ajuste'?0:1))return alert('Quantidade inválida.');let anterior=num(p.qtd);if(t==='saida'&&q>anterior)return alert('Estoque insuficiente.');let final=t==='entrada'?anterior+q:t==='saida'?anterior-q:q;ps=ps.map(x=>x.id===p.id?{...x,qtd:final}:x);salvar(P,ps);mov({produtoId:p.id,produto:p.nome,tipo:t,quantidade:q,anterior,final,fornecedor:t==='entrada'?(fs.find(f=>f.id===$('mf').value)||{}).nome||'':'',observacao:$('mo').value});telaEstoque()}}
function mov(d){let l=ler(M);l.unshift({id:gerar(),data:new Date().toISOString(),...d});salvar(M,l)}
function telaRelatorios(){$('subtitulo').textContent='MERCADINHO SILVA CAMARGO';$('principal').innerHTML='<div class="painel"><h2>⚲ Filtros</h2><div class="grid"><div class="campo"><label>Produto</label><input id="rp" oninput="listaRelatorios()" placeholder="Nome do produto"></div><div class="campo"><label>Tipo</label><select id="rt" onchange="listaRelatorios()"><option value="">Todos</option><option value="entrada">Entradas</option><option value="saida">Saídas</option><option value="ajuste">Ajustes</option></select></div><div class="campo"><label>Data Início</label><input type="date" id="ri" onchange="listaRelatorios()"></div><div class="campo"><label>Data Fim</label><input type="date" id="rf" onchange="listaRelatorios()"></div></div><button onclick="window.print()">▣ Imprimir</button></div><div class="resumos"><div class="resumo">↗<strong id="re">0</strong>Entradas</div><div class="resumo">↘<strong id="rs">0</strong>Saídas</div><div class="resumo" style="background:#dbeafe;color:#154ee6">⟳<strong id="ra">0</strong>Ajustes</div></div><div class="painel"><h2>Histórico de Movimentações <small id="rc"></small></h2><div class="tabela"><table><thead><tr><th>Data</th><th>Produto</th><th>Tipo</th><th>Quantidade</th><th>Estoque Final</th><th>Observação</th></tr></thead><tbody id="linhas"></tbody></table></div></div>';listaRelatorios()}
function listaRelatorios(){let q=$('rp').value.toLowerCase(),t=$('rt').value,a=$('ri').value,b=$('rf').value;let l=ler(M).filter(m=>String(m.produto).toLowerCase().includes(q)&&(!t||m.tipo===t)&&(!a||m.data.slice(0,10)>=a)&&(!b||m.data.slice(0,10)<=b));$('re').textContent=l.filter(m=>m.tipo==='entrada').reduce((s,m)=>s+num(m.quantidade),0);$('rs').textContent=l.filter(m=>m.tipo==='saida').reduce((s,m)=>s+num(m.quantidade),0);$('ra').textContent=l.filter(m=>m.tipo==='ajuste').length;$('rc').textContent='('+l.length+' registros)';$('linhas').innerHTML=l.map(m=>'<tr><td>'+new Date(m.data).toLocaleString('pt-BR')+'</td><td>'+esc(m.produto)+'</td><td>'+esc(m.tipo)+'</td><td>'+num(m.quantidade)+'</td><td>'+num(m.final)+'</td><td>'+esc(m.observacao)+'</td></tr>').join('')||'<tr><td colspan="6">Nenhuma movimentação encontrada para os filtros selecionados.</td></tr>'}
</script></body></html>
